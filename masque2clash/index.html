<!DOCTYPE html>
<html lang="zh">
<head> 
    <meta charset="UTF-8"> 
    <link rel="icon" href="https://masque.pages.dev/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASQUE To Clash 转换器 | WARP MASQUE 导航 - MASQUE.pages.dev</title>
    <style>
        :root { 
            --bg-color: #0f172a; 
            --card-bg: rgba(30, 41, 59, 0.7); 
            --accent-blue: #3b82f6; 
            --text-main: #f1f5f9; 
            --text-muted: #94a3b8; 
            --border-color: rgba(255, 255, 255, 0.08); 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.18) 0%, transparent 600px); 
            background-repeat: no-repeat; 
            color: var(--text-main); 
            line-height: 1.6; 
            padding: 50px 20px; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container { width: 100%; max-width: 500px; margin: 0 auto; }

        /* 卡片主体：包含标题、按钮和底部链接 */
        .group-card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            padding: 50px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            text-align: center;
        }

        h1 { 
            font-size: 2rem; 
            font-weight: 800; 
            letter-spacing: -0.02em; 
            background: linear-gradient(to right, #ffffff, var(--accent-blue)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 35px; 
        }

        /* 按钮容器上下排列 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 统一按钮样式 */
        .btn-action { 
            display: block;
            width: 100%;
            padding: 14px; 
            border-radius: 50px; 
            font-size: 1rem; 
            font-weight: 700; 
            text-decoration: none;
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); 
            cursor: pointer;
            border: none;
            box-sizing: border-box;
        }

        /* 上面按钮样式 */
        .btn-primary {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(37, 99, 235, 0.8)); 
            color: #fff; 
        }

        .btn-primary:hover:not(.disabled) { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3); 
        }

        /* 下面按钮样式 */
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        /* 禁用状态 */
        .btn-action.disabled {
            opacity: 0.6;
            pointer-events: none;
            cursor: not-allowed;
            transform: none;
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-muted);
            border: 1px solid transparent;
        }

        .sub-note {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer { 
            text-align: center; 
            margin-top: 45px; 
            padding-top: 25px; 
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--text-main);
        }

        /* 隐蔽表单项，保持界面洁净 */
        .hidden-form-controls {
            display: none !important;
        }

        @media (max-width: 600px) {
            body { padding: 30px 15px; }
            .group-card { padding: 40px 20px; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="group-card">
            <h1>MASQUE To Clash 转换器</h1>

            <div class="btn-group">
                <!-- 上面的按钮：一键生成Clash配置文件 -->
                <button id="genBtn" class="btn-action btn-primary" onclick="handleOneClickGenerate(this)">一键生成Clash配置文件</button>
                
                <!-- 下面的按钮：自定义配置，新标签页跳转 -->
                <a class="btn-action btn-secondary" href="https://masque.pages.dev/tools/usque-converter/" target="_blank" rel="noopener noreferrer">自定义配置</a>
            </div>

            <div class="sub-note" id="statusNote">自动申请 MASQUE 账号并导出 Clash YAML</div>

            <div class="footer">
                <a href="https://Masque.pages.dev" target="_blank" rel="noopener noreferrer">Masque导航</a> ·
                <a href="https://masque.pages.dev/tools/usque-converter/" target="_blank" rel="noopener noreferrer">Clash转换器</a> ·
                <a href="https://github.com/Diniboy1123/usque" target="_blank" rel="noopener noreferrer">Usque内核</a>
            </div>
        </div>
    </div>

    <!-- 隐藏表单：保留原版 HTML 的所有默认配置项与 DOM 元素 ID -->
    <div class="hidden-form-controls">
        <textarea id="jsonInput"></textarea>
        <select id="endpointIp"><option value="all" selected>全部</option></select>
        <input type="text" id="endpointPort" value="443">
        <input type="text" id="sni" value="www.microsoft.com">
        <input type="text" id="dns" value="1.1.1.1, 2606:4700:4700::1111">
        <select id="cc"><option value="bbr" selected>bbr</option></select>
        <input type="checkbox" id="udp" checked>
        <input type="text" id="name" value="MASQUE.pages.dev">
        <button id="convertBtn">转换</button>
        <button id="downloadBtn">下载</button>
    </div>

    <!-- 预先引入压缩包原有的模板文件 -->
    <script src="yaml-template.js?v=0828"></script>

    <script>
        // 动态将压缩包的 script.js 解包提升至全局，确保能够直接复用其转换与生成逻辑
        let scriptLoaded = false;
        async function loadAndUnpackScript() {
            if (scriptLoaded) return;
            try {
                const res = await fetch('script.js?v=0828');
                let code = await res.text();
                // 移除限制在 DOMContentLoaded 内部闭包的作用域
                code = code.replace(/document\.addEventListener\s*\(\s*['"]DOMContentLoaded['"]\s*,\s*function\s*\(\)\s*\{/g, '(function(){');
                // 执行解包后的源码
                eval(code);
                scriptLoaded = true;
            } catch (e) {
                console.error("加载 script.js 失败", e);
            }
        }

        async function handleOneClickGenerate(btn) {
            btn.innerText = "正在注册并生成...";
            btn.classList.add("disabled");

            try {
                // 确保原包 script.js 已加载解包
                await loadAndUnpackScript();

                // 1. 静默请求获取 JSON 账号数据
                const response = await fetch('https://usque-register-server.pages.dev/claim?raw=true');
                const resData = await response.json();

                if (!resData.success || !resData.content) {
                    throw new Error(resData.message || '获取账号数据失败');
                }

                // 2. 将数据写入隐藏的 #jsonInput 文本框
                const jsonInput = document.getElementById('jsonInput');
                const jsonString = typeof resData.content === 'object' ? JSON.stringify(resData.content, null, 2) : resData.content;
                jsonInput.value = jsonString;

                // 触发原生事件，确保 script.js 内部的监听机制感知数据变化
                jsonInput.dispatchEvent(new Event('input', { bubbles: true }));
                jsonInput.dispatchEvent(new Event('change', { bubbles: true }));

                // 3. 模拟触发点击隐藏的转换与下载按钮（调用原 script.js 逻辑导出文件）
                const convertBtn = document.getElementById('convertBtn');
                const downloadBtn = document.getElementById('downloadBtn');

                if (convertBtn) convertBtn.click();
                if (downloadBtn) downloadBtn.click();

                // 4. 转换完成，按要求更新按钮样式与提示文本
                btn.innerText = "下载完成后将文件导入到Clash";
                document.getElementById('statusNote').innerText = "已成功生成配置文件 Mihomo-Masque.yaml！";

            } catch (err) {
                alert("❌ 生成失败：" + err.message);
                btn.innerText = "一键生成Clash配置文件";
                btn.classList.remove("disabled");
            }
        }
    </script>
</body>
</html>
